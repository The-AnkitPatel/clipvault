<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b0e"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>
    <radialGradient id="radialAccent" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="880" height="240" rx="12" fill="url(#bg)"/>
  <rect width="880" height="240" rx="12" fill="url(#radialAccent)"/>
  <rect width="878" height="238" x="1" y="1" rx="11" fill="none" stroke="#21262d" stroke-width="1.5"/>

  <!-- Subtle Top Accent Line -->
  <rect x="24" y="2" width="832" height="2" fill="url(#glow)"/>

  <!-- Logo Icon Container -->
  <g transform="translate(48, 44)" filter="url(#subtleShadow)">
    <rect width="68" height="68" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <!-- Vault / Clipboard Icon -->
    <path d="M24 16 C24 13.8 25.8 12 28 12 L40 12 C42.2 12 44 13.8 44 16 L44 19 L47 19 C49.2 19 51 20.8 51 23 L51 51 C51 53.2 49.2 55 47 55 L21 55 C18.8 55 17 53.2 17 51 L17 23 C17 20.8 18.8 19 21 19 L24 19 Z" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <!-- Inner Lock/Keyhole -->
    <circle cx="34" cy="35" r="4.5" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <path d="M34 39.5 L34 44" stroke="#58a6ff" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="28" y="15" width="12" height="4" rx="2" fill="#58a6ff"/>
  </g>

  <!-- Typography -->
  <g transform="translate(136, 68)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="34" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">ClipVault</text>
    <text x="145" y="-4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#3fb950" letter-spacing="1.5">v1.0.0 • OPEN SOURCE</text>
    <text y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#8b949e">A state-of-the-art clipboard history engine for Windows sealed with AES-256-GCM.</text>
  </g>

  <!-- Feature Metric Pills -->
  <g transform="translate(48, 148)">
    <!-- Pill 1: Latency -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#3fb950"/>
      <text x="34" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">38 ms</text>
      <text x="78" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#8b949e">Hot popup</text>
    </g>

    <!-- Pill 2: AES-256-GCM -->
    <g transform="translate(192, 0)">
      <rect width="206" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#58a6ff"/>
      <text x="34" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">AES-256-GCM</text>
      <text x="122" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#8b949e">DPAPI sealed</text>
    </g>

    <!-- Pill 3: Glide Selection -->
    <g transform="translate(410, 0)">
      <rect width="186" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#d29922"/>
      <text x="34" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Glide Select</text>
      <text x="110" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#8b949e">Ordered paste</text>
    </g>

    <!-- Pill 4: Zero Polling -->
    <g transform="translate(608, 0)">
      <rect width="176" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#bc8cff"/>
      <text x="34" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">0% Idle CPU</text>
      <text x="110" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#8b949e">Event driven</text>
    </g>
  </g>
</svg>
